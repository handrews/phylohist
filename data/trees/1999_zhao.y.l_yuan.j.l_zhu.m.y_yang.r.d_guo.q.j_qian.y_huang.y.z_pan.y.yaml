- taxon: 纤毛环类
  notes: >
    Lophophorates, but the latin form is not given directly despite citing
    a paper that uses it.
  pages: 4
  children:
  - taxon: pararotadiscus_zhu.m.y_erdtmann_zhao.y.l_1999
    citedAs: Pararotadiscus gen. nov. 以示两者明显区别 (Zhu et al., 1999)
    nudum: true
    pages: 4
    editorial:
      inferred: [nudum]
      basis: >
        The citation is an abstract with no formal description.  The Chinese
        text on page 4 gives a basic description but also indicates only an
        intention (拟建立, "plans to erect") regarding the new genus, and
        does not assign a type or other species.  The plate caption was intended
        to reassign Rotadiscus guizhouensis Zhao and Zhu 1994, but this is
        not formally stated and the species name was given incorrectly; no other
        source credits this publication for Pararotadiscus.
        Pararotadiscus is properly credited to Zhu, Zhao, & Chen (2002),
        which references this paper as if it stated Rotadiscus here.
    notes: >
      Latin name printed in the Chinese section on page 4 and the plate caption
      on page 13.  The English translation on page 11 mentions only Rotadiscus
      and not Pararotadiscus.
      Classified as "medusiform animals" in the English section, with the
      Chinese section using a word equivalent to Lophophorata and citing
      Dzik et al. 1997 which assigns the taxa in question to Lophophorata.
      The Chinese section also lists the appropriate included phyla for
      Lophophorata (Bryozoa, Brachiopoda, Phoronida, and Entoprocta).
    children:
    - taxon: guizhouensis_zhao.y.l_zhu.m.y_1994
      citedAs: Pararotadiscus taijiangensis (Zhao and Zhu, 1994)
      lapsus:
        taxon: taijiangensis_zhao.y.l_yuan.j.l_zhu.m.y_yang.r.d_guo.q.j_qian.y_huang.y.z_pan.y_1999
      pages: 13
      notes: >
        Apparently intended to reference
        Rotadiscus guizhouensis Zhao & Zhu 1994, which in 2002 was validly
        recombined as Pararotadiscus guizhouensis.
        The lack of a "n. sp." and the parentheses around (Zhao and Zhu, 1994)
        indicate a recombination instead of a new taxon, and there are two
        other "taijiangensis" species on the page that may be sources of the
        confusion.  Both "taijiangensis" and "guizhouensis" are also
        place-based names.
        Neither species is given in the Chinese text; only the genus is
        mentioned.  Therefore this is treated as a lapsus calami rather than
        a nomen nudum at the species level.
      illustrations:
      - plate: III
        figures: 1
        of: 112
        depicts: specimen
      - plate: III
        figures: 6
        of: 113
        depicts: specimen
      material:
      - prefix: GK
        numbers: [112]
        asPrinted: GTBM-20-33, GK112
        horizon: miaobanpo-bed-20
        locality: miaobanpo
        localityNumbers:
        - prefix: GTBM
          number: 20-33
      - prefix: GK
        numbers: [113]
        asPrinted: GTBM-24-3-633, GK113。
        horizon: miaobanpo-bed-24-3
        locality: miaobanpo
        localityNumbers:
        - prefix: GTBM
          number: 24-3-633
