- taxon: pararotadiscus_zhu.m.y_erdtmann_zhao.y.l_1999
  citedAs: Pararotadiscus gen. nov. 以示两者明显区别 (Zhu et al., 1999)
  nudum: true
  pages: 4
  editorial:
    inferred: [nudum]
    basis: >
      The citation is an abstract with no formal description.  The Chinese
      text on page 38 gives a basic description but also indicates only an
      intention (拟建立, "plans to erect") regarding the new genus, and
      does not assign a type or other species.  The plate caption wss intended
      to reassign Rotadiscus guizhouensis Zhao and Zhu 1994, but this is
      not formally stated and the species name was given incorrectly; no other
      source credits this publicaton for Pararotadiscus.
      Pararotadiscus is properly credited to Zhu, Zhao, & Chen (2002),
      which references this paper as if it stated Rotadiscus here.
  notes: >
    Latin name printed in the Chinese section on page 4 and the plate caption
    on page 13.  The English translation on page 11 mentions only Rotadiscus
    and not Pararotadiscus.
    Classified as "medusiform animals" in the English section.  The
    Chinese section references a prior assignment to or near what
    seems to be Lophophorata based on the included phyla (Bryozoa,
    Brachiopoda, Phoronida, and Entoprocta), but does not appear
    to definitively endorse a position.
  children:
  - taxon: guizhouensis_zhao.y.l_zhu.m.y_1994
    citedAs: Pararotadiscus taijiangensis (Zhao and Zhu, 1994)
    lapsus:
      taxon: taijiangensis_zhao.y.l_yuan.j.l_zhu.m.y_yang.r.d_guo.q.j_qian.y_huang.y.z_pan.y_1999
    pages: 13
    notes: >
      Apparently intended to reference Rotadiscus guizhouensis Zhao & Zhu 1994,
      which in 2002 was validly recombined as Pararotadiscus guizhouensis
      in a paper that cites this one as if it stated Rotadiscus guizhouensis
      instead of Pararotadiscus taijiangensis.  Confusingly, it also
      claims figures 1-3 and 5 of plate 3 depict this species rather than
      figures 1 and 6 of that plate (among other errors elsewhere
      in that paper).  The lack of a "n. sp." and the parentheses around
      (Zhao and Zhu, 1994) indicate a recombination instead of a new taxon,
      and there are two other "taijiangensis" species on the page that may
      be sources of the confusion.  Both it and "guizhouensis" are also
      place-based names.  Neither species is given in the Chinese text; only
      the genus is mentioned.  Therefore this is treated as a lapsus calami
      rather than a nomen nudum at the species level.
    illustrations:
    - plate: III
      figures: 1
      of: 112
    - plate: III
      figures: 6
      of: 113
    material:
    - prefix: GK
      numbers: [112]
      asPrinted: GTBM-20-33, GK112
      horizon: kaili-at-boundary
      locality: miaobanpo
      localityNumbers:
      - prefix: GTBM
        number: 20-33
    - prefix: GK
      numbers: [113]
      asPrinted: GTBM-24-3-633, GK113。
      horizon: kaili-at-boundary
      locality: miaobanpo
      localityNumbers:
      - prefix: GTBM
        number: 24-3-633
