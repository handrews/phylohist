taxonomies:
- taxon: ambulacraria
  citedAs: Typus Ambulacraria
  new: true
  rank: Phylum
  children:
  - taxon: radiata
    citedAs: 1. - Subtypus Radiata s. Echinodermata
    rank: Subphylum
    emended: true
    editorial:
      inferred: [emended]
      basis: >
        Radiata had encompassed all animals with apparent radial symmetry,
        and other researchers were starting to remove Echinodermata and
        retain only Cnidaria and Ctenophora in Radiata.  Although it is
        not absolutely certain that Metschnikoff was intending to restrict
        the existing taxon.
    or:
      taxon: echinodermata
      citedAs: 1. - Subtypus Radiata s. Echinodermata
      rank: Subphylum
    children: null
  - taxon: bilateralia
    citedAs: 2. - Subtypus Bilateralia s. Enteropneusta
    rank: Subphylum
    or:
      taxon: enteropneusta
      citedAs: 2. - Subtypus Bilateralia s. Enteropneusta
      rank: Subphylum
    children: null
