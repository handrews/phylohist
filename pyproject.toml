[project]
name = "phylohist"
version = "0.1.0"
description = "Published taxonomic opinions on Palaeozoic echinoderms, recorded as printed, with tools that answer from them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Henry H. Andrews", email = "henry@henryandrews.net"}]
requires-python = ">=3.12,<4"
keywords = [
  "taxonomy",
  "phylogenetics",
  "palaeontology",
  "echinoderms",
  "nomenclature",
  "mcp",
  "human-in-the-loop",
  "local-first",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "coloredlog>=0.2.5,<0.3",
  "pyyaml>=6.0.3,<7",
  "json-schema-engine>=0.0.6,<0.0.7",
  "mcp>=2.2.0,<3",
]

[project.scripts]
phylohist = "phylohist.cli:main"
phylohist-mcp = "phylohist.mcp:main"
regenerate = "phylohist.regenerate:main"

[project.urls]
Repository = "https://github.com/handrews/phylohist"

[tool.poetry]
# The claim table is generated into phylohist/table/, so the wheel carries it
# and an installed copy answers from the table as of its build.
packages = [{include = "phylohist"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9"
ruff = "^0.16.7"
pytest-cov = "^7.1.0"

# Only scripts/eval_run.py and scripts/eval_grade.py --judge call a model, and
# neither ships in the package.
[tool.poetry.group.eval.dependencies]
anthropic = ">=1.5.0,<2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
indent-width = 2
target-version = "py312"
extend-exclude = ["notes", "eval/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
markers = [
  "production: a check of the curated corpus under data/ itself",
  "demo: the eval questions and the walkthrough over the committed phylohist/table/; run with --demo",
]
